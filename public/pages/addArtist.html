<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Add your band to MyScene and let the local scene find you.">
  <meta name="theme-color" content="#08010f">
  <title>Add Artist — MyScene</title>
  <link rel="icon" type="image/png" href="../assets/icons/mySceneLogo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../style.css">
</head>

<body>

  <a class="skipLink" href="#main">Skip to content</a>
  <div class="starfield" aria-hidden="true"></div>

  <header>
    <nav class="nav" aria-label="Main">
      <div class="navLeft">
        <a class="btn ghost" href="../index.html">&larr; Back to MyScene</a>
      </div>

      <div class="logoContainer">
        <a href="../index.html" class="brand" aria-label="MyScene home">
          <img src="../assets/icons/mySceneLogo.png" class="logo" id="smallLogo" alt=""
               onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logoWordmark',textContent:'MyScene'}))">
        </a>
      </div>

      <div class="navRight">
        <a class="btn pink" href="login.html">Log In</a>
      </div>

      <button class="navToggle" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="navMenu">
        <span class="bar"></span>
        <span class="bar"></span>
        <span class="bar"></span>
      </button>

      <div class="navMenu" id="navMenu">
        <a class="btn ghost" href="../index.html">&larr; Back to MyScene</a>
        <a class="btn pink" href="login.html">Log In</a>
      </div>
    </nav>
  </header>

  <main id="main">
    <div class="add-artist-container">
      <h1>Ready to grow your community? Add your band.</h1>

      <!-- This is where the user can add their band! -->
      <div id="bandSubmission" class="formPanel">

        <div class="form-group">
          <label for="bandName">Name of band</label>
          <input type="text" id="bandName" placeholder="e.g. Auntie Aircraft" required>
        </div>

        <div class="form-group">
          <label for="instagramHandle">Instagram handle</label>
          <input type="text" id="instagramHandle" placeholder="@yourband" autocomplete="off">
        </div>

        <div class="form-group">
          <label for="bandGenre">Genre</label>
          <input type="text" id="bandGenre" placeholder="e.g. Rock, Indie, Punk..." required>
        </div>

        <div class="form-group">
          <label for="bandCity">City</label>
          <input type="text" id="bandCity" placeholder="e.g. Fayetteville" required>
        </div>

        <div class="form-group">
          <label for="bandState">State</label>
          <input type="text" id="bandState" placeholder="e.g. Arkansas" required>
        </div>

        <!-- Submit Button -->
        <button id="addBandButton" class="btn pink" type="button">Add to MyScene</button>
        <p class="formHint">Name, city, state, and genre are required.</p>
      </div>
    </div>
  </main>

  <script src="../js/ui.js"></script>
  <script src="../js/addArtist.js"></script>

  <footer>
    <div class="footerDivider"></div>
    <p>Created by Theta Protocol &mdash; Hoghacks Hackathon 2026 Team</p>
  </footer>

</body>
</html>
