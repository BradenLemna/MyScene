Initial Implementation: Shayne Thompson, @whisperingcoder (Github)
Continued Development: Braden Lemna, @BradenLemna (Github)
Description: Login page for MyScene. Takes username and password, verifies with backend, and redirects to the homepage on success.
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Log in to MyScene.">
    <meta name="theme-color" content="#08010f">
    <title>Log In — MyScene</title>
    <link rel="icon" type="image/png" href="../assets/icons/mySceneLogo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <a class="skipLink" href="#main">Skip to content</a>
    <div class="starfield" aria-hidden="true"></div>

    <header>
        <nav class="nav" aria-label="Main">
            <div class="navLeft">
                <a class="btn ghost" href="../index.html">&larr; Back to MyScene</a>
            </div>

            <div class="logoContainer">
                <a href="../index.html" class="brand" aria-label="MyScene home">
                    <img src="../assets/icons/mySceneLogo.png" class="logo" id="smallLogo" alt=""
                         onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logoWordmark',textContent:'MyScene'}))">
                </a>
            </div>

            <div class="navRight"></div>

            <button class="navToggle" type="button" aria-label="Toggle menu" aria-expanded="false" aria-controls="navMenu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>

            <div class="navMenu" id="navMenu">
                <a class="btn ghost" href="../index.html">&larr; Back to MyScene</a>
                <a class="btn pink" href="login.html">Log In</a>
            </div>
        </nav>
    </header>

    <main id="main">
        <div class="login-container">
            <div class="login-box formPanel">
                <h1>Welcome back</h1>
                <p class="formLead">Log in to continue to MyScene.</p>
                <form id="loginForm" novalidate>
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="current-password" required autocomplete="current-password">
                    </div>

                    <button type="button" id="login" class="btn pink">Log In</button>
                </form>
            </div>
        </div>
    </main>

    <script src="../js/ui.js"></script>
    <script src="../js/login.js"></script>

    <footer>
        <div class="footerDivider"></div>
        <p>Created by Theta Protocol &mdash; Hoghacks Hackathon 2026 Team</p>
    </footer>

</body>
</html>
