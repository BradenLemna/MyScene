name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    name: Node API tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/server/package-lock.json
      - run: npm ci
      - run: npm test

  db-smoke:
    name: PHP db-api smoke test
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Install PHP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli php-mysql
      - name: Run db-api smoke test
        run: bash api/db/smoke.sh -y
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: MyScene
          DB_USERNAME: root
          DB_PASSWORD: root
